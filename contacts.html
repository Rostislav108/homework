<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Контакты — мой магазин</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Мой магазин</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#mainMenu" aria-controls="mainMenu"
                    aria-expanded="false" aria-label="Меню">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainMenu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
                    <li class="nav-item"><a class="nav-link" href="catalog.html">Каталог</a></li>
                    <li class="nav-item"><a class="nav-link" href="category.html">Задачи</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="contacts.html">Контакты</a></li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<main class="flex-grow-1">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <h1 class="mb-4">Контакты</h1>
                <p class="text-muted mb-4">
                    Напишите нам — ответим в течение рабочего дня.
                </p>

                <form action="/" method="post" class="card card-body shadow-sm">
                    <div class="mb-3">
                        <label for="name" class="form-label">Имя</label>
                        <input type="text" class="form-control" id="name" name="name"
                               placeholder="Как к вам обращаться" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email"
                               placeholder="name@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">Сообщение</label>
                        <textarea class="form-control" id="message" name="message" rows="4"
                                  placeholder="Ваш вопрос или предложение" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Отправить</button>
                </form>

                <ul class="list-unstyled mt-4 text-muted">
                    <li>Телефон: +7 (812) 000-00-00</li>
                    <li>Почта: shop@example.com</li>
                    <li>Адрес: Санкт-Петербург, ул. Примерная, 1</li>
                </ul>
            </div>
        </div>
    </div>
</main>

<footer class="bg-dark text-white-50 py-4 mt-auto">
    <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
        <span>© 2026 Мой магазин. Учебный проект.</span>
        <a class="link-light text-decoration-none" href="contacts.html">Связаться с нами</a>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
